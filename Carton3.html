<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carton 2 | Business Manager</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --navy: #172744;
            --blue: #356ae6;
            --background: #f5f7fb;
            --border: #e7ebf2;
        }

        body {
            background: var(--background);
            color: #182235;
            font-family: system-ui, sans-serif;
        }

        .sidebar {
            width: 230px;
            position: fixed;
            inset: 0 auto 0 0;
            background: var(--navy);
            padding: 24px 15px;
            z-index: 10;
        }

        .brand {
            color: white;
            font-size: 23px;
            font-weight: 800;
            padding: 0 10px 25px;
        }

        .nav-link-custom {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
            margin: 4px 0;
            border-radius: 9px;
            color: #cbd5e7;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            background: var(--blue);
            color: white;
        }

        .main {
            margin-left: 230px;
        }

        .topbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .content {
            padding: 28px;
            max-width: 1500px;
            margin: auto;
        }

        .panel,
        .stat {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 3px 12px #17274406;
        }

        .stat {
            padding: 20px;
            height: 100%;
        }

        .stat-label {
            color: #758197;
            font-size: 13px;
            font-weight: 650;
        }

        .stat-number {
            font-size: 26px;
            font-weight: 800;
            margin-top: 10px;
            overflow-wrap: anywhere;
        }

        .page-title {
            font-size: 27px;
            font-weight: 800;
        }

        .section-head {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-head h2 {
            font-size: 16px;
            font-weight: 800;
            margin: 0;
        }

        .btn {
            border-radius: 9px;
            font-size: 13px;
            font-weight: 650;
            padding: 9px 13px;
        }

        .btn-primary {
            background: var(--blue);
            border-color: var(--blue);
        }

        .form-control,
        .form-select {
            font-size: 14px;
            border-color: #dfe5ee;
            border-radius: 9px;
            padding: 10px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 750;
        }

        .table {
            margin: 0;
        }

        .table th {
            color: #758197;
            font-size: 10px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .table td {
            font-size: 13px;
            vertical-align: middle;
        }

        .pill {
            display: inline-block;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 750;
        }

        .green {
            background: #e5f7ed;
            color: #137a4b;
        }

        .yellow {
            background: #fff2d7;
            color: #946200;
        }

        .red {
            background: #ffebeb;
            color: #b42318;
        }

        .muted {
            color: #758197;
        }

        .mobile-menu {
            display: none;
        }

        @media (max-width: 850px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform .2s;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .mobile-menu {
                display: inline-block;
            }

            .content {
                padding: 20px 12px;
            }

            .topbar {
                padding: 0 15px;
            }

            .page-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <i class="bi bi-box-seam-fill me-2"></i>Carton 2
        </div>

        <a href="#" class="nav-link-custom active" data-page="dashboard">
            <i class="bi bi-grid"></i> Dashboard
        </a>
        <a href="#" class="nav-link-custom" data-page="clients">
            <i class="bi bi-people"></i> Clients
        </a>
        <a href="#" class="nav-link-custom" data-page="cartons">
            <i class="bi bi-boxes"></i> Cartons
        </a>
        <a href="#" class="nav-link-custom" data-page="stock">
            <i class="bi bi-clipboard-check"></i> Stock
        </a>
        <a href="#" class="nav-link-custom" data-page="orders">
            <i class="bi bi-receipt"></i> Orders & History
        </a>
        <a href="#" class="nav-link-custom" data-page="backup">
            <i class="bi bi-shield-check"></i> Backup & Restore
        </a>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light mobile-menu" id="menuBtn">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <div>
                    <strong id="topTitle">Dashboard</strong>
                    <div class="small muted">Business management</div>
                </div>
            </div>
            <span class="small muted" id="today"></span>
        </header>

        <div class="content" id="app"></div>
    </main>

    <!-- Add/edit form -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="editForm">
                <div class="modal-header">
                    <h5 class="fw-bold mb-0" id="editTitle">Add record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="editFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New order -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <form class="modal-content" id="orderForm">
                <div class="modal-header">
                    <h5 class="fw-bold mb-0">New carton order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Client *</label>
                            <select class="form-select" id="oClient" required></select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Carton type *</label>
                            <select class="form-select" id="oCarton" required></select>
                        </div>

                        <div class="col-sm-4">
                            <label class="form-label">Date *</label>
                            <input class="form-control" type="date" id="oDate" required>
                        </div>

                        <div class="col-sm-4">
                            <label class="form-label">Quantity *</label>
                            <input class="form-control" type="number" min="1" step="1" id="oQty" value="1" required>
                        </div>

                        <div class="col-sm-4">
                            <label class="form-label">Price per carton (Rs) *</label>
                            <input class="form-control" type="number" min="0" step=".01" id="oPrice" value="0" required>
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label">Amount paid (Rs)</label>
                            <input class="form-control" type="number" min="0" step=".01" id="oPaid" value="0">
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label">Payment note</label>
                            <input class="form-control" id="oNote" placeholder="Cash, bank transfer, etc.">
                        </div>
                    </div>

                    <div class="alert alert-light border mt-4 mb-0 d-flex justify-content-between">
                        <div>
                            <small class="muted">Order total</small>
                            <div class="fs-5 fw-bold" id="oTotal">Rs 0</div>
                        </div>
                        <div class="text-end">
                            <small class="muted">Balance due</small>
                            <div class="fs-5 fw-bold text-danger" id="oBalance">Rs 0</div>
                        </div>
                    </div>

                    <div class="small muted mt-2" id="oStock"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary">
                        <i class="bi bi-check2 me-1"></i> Save order
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div class="toast" id="toast">
            <div class="toast-body" id="toastText">Saved</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (() => {
            "use strict";

            // Keep the existing Carton 2 storage keys.
            const KEYS = {
                clients: "carton2_clients",
                cartons: "carton2_cartons",
                sales: "carton2_sales",
                stock: "carton2_stock_history"
            };

            const $ = id => document.getElementById(id);
            const today = () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
            };
            const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            const num = v => Number(v || 0);
            const cash = v => "Rs " + num(v).toLocaleString("en-PK", {maximumFractionDigits: 2});
            const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[c]);
            const dateText = v => v
                ? new Date(v + "T00:00:00").toLocaleDateString(undefined, {day: "2-digit", month: "short", year: "numeric"})
                : "—";

            function load(key) {
                try {
                    const data = JSON.parse(localStorage.getItem(key) || "[]");
                    return Array.isArray(data) ? data : [];
                } catch {
                    return [];
                }
            }

            const state = {
                clients: load(KEYS.clients),
                cartons: load(KEYS.cartons),
                sales: load(KEYS.sales),
                stock: load(KEYS.stock),
                page: "dashboard",
                search: ""
            };

            // Normalize common field names from older Carton 2 versions.
            state.clients = state.clients.map(x => ({
                ...x,
                id: String(x.id ?? x.clientId ?? uid()),
                name: x.name ?? x.clientName ?? x.client ?? "Unnamed client",
                phone: x.phone ?? "",
                location: x.location ?? "",
                notes: x.notes ?? ""
            }));

            state.cartons = state.cartons.map(x => ({
                ...x,
                id: String(x.id ?? x.cartonId ?? uid()),
                name: x.name ?? x.cartonName ?? x.type ?? "Unnamed carton",
                stock: num(x.stock ?? x.quantity ?? x.available),
                price: num(x.price ?? x.unitPrice ?? x.rate)
            }));

            state.sales = state.sales.map(x => ({
                ...x,
                id: String(x.id ?? uid()),
                clientId: String(x.clientId ?? ""),
                cartonId: String(x.cartonId ?? ""),
                clientName: x.clientName ?? x.client ?? "",
                cartonName: x.cartonName ?? x.carton ?? "",
                date: x.date ?? x.orderDate ?? today(),
                qty: num(x.qty ?? x.quantity),
                price: num(x.price ?? x.unitPrice ?? x.rate),
                paid: num(x.paid ?? x.amountPaid),
                note: x.note ?? ""
            }));

            state.stock = state.stock.map(x => ({
                ...x,
                id: String(x.id ?? uid()),
                cartonId: String(x.cartonId ?? ""),
                date: x.date ?? today(),
                action: x.action ?? "add",
                qty: num(x.qty ?? x.quantity),
                note: x.note ?? ""
            }));

            function save() {
                try {
                    Object.keys(KEYS).forEach(k => {
                        localStorage.setItem(KEYS[k], JSON.stringify(state[k]));
                    });
                    return true;
                } catch {
                    notify("Unable to save. Please download a backup.");
                    return false;
                }
            }

            const editModal = new bootstrap.Modal($("editModal"));
            const orderModal = new bootstrap.Modal($("orderModal"));
            const toast = new bootstrap.Toast($("toast"), {delay: 2300});

            function notify(message) {
                $("toastText").textContent = message;
                toast.show();
            }

            function client(id) {
                return state.clients.find(x => String(x.id) === String(id));
            }

            function carton(id) {
                return state.cartons.find(x => String(x.id) === String(id));
            }

            function total(s) {
                return num(s.qty) * num(s.price);
            }

            function balance(s) {
                return Math.max(0, total(s) - num(s.paid));
            }

            function clientName(s) {
                return client(s.clientId)?.name || s.clientName || "Unknown client";
            }

            function cartonName(s) {
                return carton(s.cartonId)?.name || s.cartonName || "Unknown carton";
            }

            function sold(id) {
                return state.sales
                    .filter(s => String(s.cartonId) === String(id))
                    .reduce((sum, s) => sum + num(s.qty), 0);
            }

            function heading(title, subtitle, buttons = "") {
                return `
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
        <div>
          <div class="small text-primary fw-bold">CARTON 2</div>
          <h1 class="page-title">${title}</h1>
          <div class="muted small">${subtitle}</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">${buttons}</div>
      </div>`;
            }

            function stat(label, value, icon) {
                return `
      <div class="stat">
        <div class="d-flex justify-content-between">
          <span class="stat-label">${label}</span>
          <i class="bi ${icon} text-primary fs-5"></i>
        </div>
        <div class="stat-number">${value}</div>
      </div>`;
            }

            function addButton(action, label, icon = "plus-lg") {
                return `<button class="btn btn-primary" data-action="${action}">
      <i class="bi bi-${icon} me-1"></i>${label}
    </button>`;
            }

            function emptyRow(message, columns = 6) {
                return `<tr><td colspan="${columns}" class="text-center muted p-5">
      <i class="bi bi-inbox fs-3 d-block mb-2"></i>${message}
    </td></tr>`;
            }

            function render() {
                document.querySelectorAll("[data-page]").forEach(a => {
                    a.classList.toggle("active", a.dataset.page === state.page);
                });

                const titles = {
                    dashboard: "Dashboard",
                    clients: "Clients",
                    cartons: "Cartons",
                    stock: "Stock",
                    orders: "Orders & History",
                    backup: "Backup & Restore"
                };

                $("topTitle").textContent = titles[state.page];

                const pages = {
                    dashboard: dashboardPage,
                    clients: clientsPage,
                    cartons: cartonsPage,
                    stock: stockPage,
                    orders: ordersPage,
                    backup: backupPage
                };

                $("app").innerHTML = pages[state.page]();
                bindPage();
            }

            function dashboardPage() {
                const totalSales = state.sales.reduce((sum, s) => sum + total(s), 0);
                const due = state.sales.reduce((sum, s) => sum + balance(s), 0);
                const stock = state.cartons.reduce((sum, c) => sum + num(c.stock), 0);
                const recent = [...state.sales]
                    .sort((a, b) => b.date.localeCompare(a.date))
                    .slice(0, 6);

                return `
      ${heading("Dashboard", "Your business at a glance.",
                    addButton("order", "New order") + addButton("client", "Add client", "person-plus"))}

      <div class="row g-3 mb-4">
        <div class="col-6 col-xl-3">${stat("Total clients", state.clients.length, "bi-people")}</div>
        <div class="col-6 col-xl-3">${stat("Cartons in stock", stock.toLocaleString(), "bi-boxes")}</div>
        <div class="col-6 col-xl-3">${stat("Sales value", cash(totalSales), "bi-graph-up")}</div>
        <div class="col-6 col-xl-3">${stat("Outstanding", cash(due), "bi-wallet2")}</div>
      </div>

      <div class="panel">
        <div class="section-head">
          <h2>Recent orders</h2>
          <button class="btn btn-outline-secondary" data-page="orders">View all</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr>
              <th>Date</th><th>Client</th><th>Carton</th>
              <th>Quantity</th><th>Total</th><th>Balance</th>
            </tr></thead>
            <tbody>
              ${recent.length ? recent.map(s => `
                <tr>
                  <td>${dateText(s.date)}</td>
                  <td>${esc(clientName(s))}</td>
                  <td>${esc(cartonName(s))}</td>
                  <td>${num(s.qty).toLocaleString()}</td>
                  <td class="fw-bold">${cash(total(s))}</td>
                  <td><span class="pill ${balance(s) ? "yellow" : "green"}">${cash(balance(s))}</span></td>
                </tr>`).join("") : emptyRow("No orders yet. Click New order to begin.")}
            </tbody>
          </table>
        </div>
      </div>`;
            }

            function clientsPage() {
                const q = state.search.toLowerCase();
                const rows = state.clients.filter(c =>
                    (c.name + " " + c.phone + " " + c.location).toLowerCase().includes(q)
                );

                return `
      ${heading("Clients", "Manage your customers.", addButton("client", "Add client", "person-plus"))}
      <div class="panel">
        <div class="section-head">
          <h2>Client list (${state.clients.length})</h2>
          <input id="search" class="form-control" style="max-width:260px"
                 placeholder="Search clients..." value="${esc(state.search)}">
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr>
              <th>Client</th><th>Phone</th><th>Orders</th>
              <th>Sales total</th><th>Balance due</th><th>Actions</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(c => {
                    const sales = state.sales.filter(s => String(s.clientId) === String(c.id));
                    return `<tr>
                  <td><b>${esc(c.name)}</b><div class="small muted">${esc(c.location)}</div></td>
                  <td>${esc(c.phone || "—")}</td>
                  <td>${sales.length}</td>
                  <td>${cash(sales.reduce((a, s) => a + total(s), 0))}</td>
                  <td class="text-danger">${cash(sales.reduce((a, s) => a + balance(s), 0))}</td>
                  <td class="text-nowrap">
                    <button class="btn btn-sm btn-outline-secondary" data-action="client-history" data-id="${esc(c.id)}">History</button>
                    <button class="btn btn-sm btn-outline-secondary" data-action="edit-client" data-id="${esc(c.id)}">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" data-action="delete-client" data-id="${esc(c.id)}">Delete</button>
                  </td>
                </tr>`;
                }).join("") : emptyRow("No clients found. Add your first client.")}
            </tbody>
          </table>
        </div>
      </div>`;
            }

            function cartonsPage() {
                const q = state.search.toLowerCase();
                const rows = state.cartons.filter(c => c.name.toLowerCase().includes(q));

                return `
      ${heading("Cartons", "Manage carton types, prices and stock.",
                    addButton("carton", "Add carton type") + addButton("order", "New order", "receipt"))}
      <div class="panel">
        <div class="section-head">
          <h2>Carton catalogue (${state.cartons.length})</h2>
          <input id="search" class="form-control" style="max-width:260px"
                 placeholder="Search cartons..." value="${esc(state.search)}">
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr>
              <th>Carton type</th><th>Available stock</th><th>Default price</th>
              <th>Units sold</th><th>Sales value</th><th>Actions</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(c => {
                        const sales = state.sales.filter(s => String(s.cartonId) === String(c.id));
                        return `<tr>
                  <td><b>${esc(c.name)}</b></td>
                  <td><span class="pill ${num(c.stock) <= 10 ? "yellow" : "green"}">${num(c.stock).toLocaleString()}</span></td>
                  <td>${cash(c.price)}</td>
                  <td>${sold(c.id).toLocaleString()}</td>
                  <td>${cash(sales.reduce((a, s) => a + total(s), 0))}</td>
                  <td class="text-nowrap">
                    <button class="btn btn-sm btn-outline-secondary" data-action="carton-history" data-id="${esc(c.id)}">History</button>
                    <button class="btn btn-sm btn-outline-secondary" data-action="edit-carton" data-id="${esc(c.id)}">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" data-action="delete-carton" data-id="${esc(c.id)}">Delete</button>
                  </td>
                </tr>`;
                    }).join("") : emptyRow("No carton types yet. Add your first carton type.")}
            </tbody>
          </table>
        </div>
      </div>`;
            }

            function ordersPage() {
                const rows = [...state.sales].sort((a, b) => b.date.localeCompare(a.date));

                return `
      ${heading("Orders & History", "Each order keeps its own date, price and payment.",
                    addButton("order", "Record order", "receipt"))}
      <div class="panel">
        <div class="section-head">
          <h2>All orders (${state.sales.length})</h2>
          <span class="small muted">Total minus paid = balance due</span>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr>
              <th>Date</th><th>Client</th><th>Carton</th><th>Qty</th>
              <th>Unit price</th><th>Total</th><th>Paid</th><th>Balance</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(s => `<tr>
                <td>${dateText(s.date)}</td>
                <td>${esc(clientName(s))}</td>
                <td>${esc(cartonName(s))}</td>
                <td>${num(s.qty).toLocaleString()}</td>
                <td>${cash(s.price)}</td>
                <td class="fw-bold">${cash(total(s))}</td>
                <td>${cash(s.paid)}</td>
                <td><span class="pill ${balance(s) ? "yellow" : "green"}">${cash(balance(s))}</span></td>
              </tr>`).join("") : emptyRow("No orders recorded yet.", 8)}
            </tbody>
          </table>
        </div>
      </div>`;
            }

            function stockPage() {
                return `
      ${heading("Stock", "Orders reduce stock automatically. Record deliveries here.",
                    addButton("adjust-stock", "Adjust stock", "plus-lg"))}
      <div class="panel mb-4">
        <div class="section-head"><h2>Current stock</h2></div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>Carton type</th><th>Available</th><th>Units sold</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${state.cartons.length ? state.cartons.map(c => `<tr>
                <td><b>${esc(c.name)}</b></td>
                <td>${num(c.stock).toLocaleString()}</td>
                <td>${sold(c.id).toLocaleString()}</td>
                <td><span class="pill ${num(c.stock) === 0 ? "red" : num(c.stock) <= 10 ? "yellow" : "green"}">
                  ${num(c.stock) === 0 ? "Out of stock" : num(c.stock) <= 10 ? "Low stock" : "In stock"}
                </span></td>
                <td><button class="btn btn-sm btn-outline-secondary" data-action="adjust-stock" data-id="${esc(c.id)}">Adjust</button></td>
              </tr>`).join("") : emptyRow("Add a carton type to track stock.", 5)}
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="section-head"><h2>Stock adjustment history</h2></div>
        <div class="table-responsive">
          <table class="table">
            <thead><tr><th>Date</th><th>Carton</th><th>Action</th><th>Quantity</th><th>Note</th></tr></thead>
            <tbody>
              ${state.stock.length ? [...state.stock].reverse().map(s => `<tr>
                <td>${dateText(s.date)}</td>
                <td>${esc(carton(s.cartonId)?.name || "Unknown carton")}</td>
                <td>${s.action === "set" ? "Set stock" : "Added stock"}</td>
                <td>${num(s.qty).toLocaleString()}</td>
                <td>${esc(s.note || "—")}</td>
              </tr>`).join("") : emptyRow("No stock adjustments yet.", 5)}
            </tbody>
          </table>
        </div>
      </div>`;
            }

            function backupPage() {
                return `
      ${heading("Backup & Restore", "Keep a safe copy of your business records.",
                    `<button class="btn btn-primary" data-action="export"><i class="bi bi-download me-1"></i>Download backup</button>`)}
      <div class="panel p-4">
        <h2 class="h5 fw-bold">Protect your records</h2>
        <p class="muted small">Records are stored in this browser. They do not automatically sync between devices.</p>
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">${stat("Clients", state.clients.length, "bi-people")}</div>
          <div class="col-6 col-md-3">${stat("Carton types", state.cartons.length, "bi-boxes")}</div>
          <div class="col-6 col-md-3">${stat("Orders", state.sales.length, "bi-receipt")}</div>
          <div class="col-6 col-md-3">${stat("Stock records", state.stock.length, "bi-clipboard-check")}</div>
        </div>
        <button class="btn btn-primary me-2" data-action="export">Export backup</button>
        <label class="btn btn-outline-secondary mb-0">
          Import backup
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </label>
        <div class="small muted mt-3">Import replaces current records. Export a backup first.</div>
      </div>`;
            }

            function bindPage() {
                document.querySelectorAll("[data-page]").forEach(a => {
                    a.onclick = e => {
                        e.preventDefault();
                        state.page = a.dataset.page;
                        state.search = "";
                        $("sidebar").classList.remove("open");
                        render();
                    };
                });

                document.querySelectorAll("[data-action]").forEach(b => {
                    b.onclick = () => action(b.dataset.action, b.dataset.id);
                });

                const search = $("search");
                if (search) search.oninput = () => {
                    state.search = search.value;
                    const pos = search.selectionStart;
                    render();
                    $("search").focus();
                    $("search").setSelectionRange(pos, pos);
                };

                const file = $("importFile");
                if (file) file.onchange = importBackup;
            }

            function action(name, id) {
                if (name === "client") openEdit("client");
                if (name === "carton") openEdit("carton");
                if (name === "edit-client") openEdit("client", id);
                if (name === "edit-carton") openEdit("carton", id);
                if (name === "delete-client") deleteClient(id);
                if (name === "delete-carton") deleteCarton(id);
                if (name === "order") openOrder();
                if (name === "adjust-stock") openStock(id);
                if (name === "export") exportBackup();
                if (name === "client-history") showHistory("client", id);
                if (name === "carton-history") showHistory("carton", id);
            }

            function openEdit(type, recordId) {
                const isClient = type === "client";
                const old = isClient ? client(recordId) : carton(recordId);

                $("editTitle").textContent = (old ? "Edit " : "Add ") + (isClient ? "client" : "carton type");

                $("editFields").innerHTML = `
      <input type="hidden" id="recordId" value="${esc(old?.id || "")}">
      <div class="mb-3">
        <label class="form-label">${isClient ? "Client name" : "Carton type name"} *</label>
        <input class="form-control" id="fName" required maxlength="100"
          value="${esc(old?.name || "")}"
          placeholder="${isClient ? "e.g. Ahmed Traders" : "e.g. Coffee cartons"}">
      </div>
      ${isClient ? `
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label">Phone</label>
            <input class="form-control" id="fPhone" value="${esc(old?.phone || "")}">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Location</label>
            <input class="form-control" id="fLocation" value="${esc(old?.location || "")}">
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label">Notes</label>
          <textarea class="form-control" id="fNotes">${esc(old?.notes || "")}</textarea>
        </div>` : `
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label">Available stock</label>
            <input class="form-control" type="number" min="0" step="1" id="fStock" value="${num(old?.stock)}" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Default price (Rs)</label>
            <input class="form-control" type="number" min="0" step=".01" id="fPrice" value="${num(old?.price)}" required>
          </div>
        </div>
        <div class="form-text mt-2">You can use a different price for every order.</div>`}`;

                $("editForm").onsubmit = e => {
                    e.preventDefault();

                    const rid = $("recordId").value;
                    const name = $("fName").value.trim();
                    if (!name) return;

                    if (isClient) {
                        const record = {
                            id: rid || uid(),
                            name,
                            phone: $("fPhone").value.trim(),
                            location: $("fLocation").value.trim(),
                            notes: $("fNotes").value.trim()
                        };

                        const index = state.clients.findIndex(x => String(x.id) === String(rid));
                        if (index >= 0) state.clients[index] = record;
                        else state.clients.push(record);
                    } else {
                        const stock = num($("fStock").value);
                        const record = {id: rid || uid(), name, stock, price: num($("fPrice").value)};
                        const index = state.cartons.findIndex(x => String(x.id) === String(rid));

                        if (index >= 0 && stock !== num(state.cartons[index].stock)) {
                            state.stock.push({
                                id: uid(), cartonId: record.id, date: today(),
                                action: "set", qty: stock, note: "Stock changed while editing carton"
                            });
                        }

                        if (index >= 0) state.cartons[index] = record;
                        else state.cartons.push(record);
                    }

                    save();
                    editModal.hide();
                    render();
                    notify("Saved successfully");
                };

                editModal.show();
            }

            function deleteClient(id) {
                if (state.sales.some(s => String(s.clientId) === String(id))) {
                    notify("This client has order history and cannot be deleted.");
                    return;
                }
                if (confirm("Delete this client?")) {
                    state.clients = state.clients.filter(c => String(c.id) !== String(id));
                    save();
                    render();
                }
            }

            function deleteCarton(id) {
                if (state.sales.some(s => String(s.cartonId) === String(id))) {
                    notify("This carton has order history and cannot be deleted.");
                    return;
                }
                if (confirm("Delete this carton type?")) {
                    state.cartons = state.cartons.filter(c => String(c.id) !== String(id));
                    save();
                    render();
                }
            }

            function fillSelect(element, records, placeholder) {
                element.innerHTML = `<option value="">${placeholder}</option>` +
                    records.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
            }

            function openOrder() {
                if (!state.clients.length || !state.cartons.length) {
                    notify("Add at least one client and carton type first.");
                    return;
                }

                fillSelect($("oClient"), state.clients, "Choose client");
                fillSelect($("oCarton"), state.cartons, "Choose carton type");

                $("oDate").value = today();
                $("oQty").value = 1;
                $("oPrice").value = 0;
                $("oPaid").value = 0;
                $("oNote").value = "";

                $("oCarton").onchange = () => {
                    const c = carton($("oCarton").value);
                    if (c) $("oPrice").value = c.price;
                    $("oStock").textContent = c ? `Available stock: ${c.stock}` : "";
                    calculateOrder();
                };

                ["oQty", "oPrice", "oPaid"].forEach(k => $(k).oninput = calculateOrder);

                calculateOrder();
                $("orderForm").onsubmit = saveOrder;
                orderModal.show();
            }

            function calculateOrder() {
                const amount = num($("oQty").value) * num($("oPrice").value);
                $("oTotal").textContent = cash(amount);
                $("oBalance").textContent = cash(Math.max(0, amount - num($("oPaid").value)));
            }

            function saveOrder(e) {
                e.preventDefault();

                const c = carton($("oCarton").value);
                const cl = client($("oClient").value);
                const qty = num($("oQty").value);
                const price = num($("oPrice").value);
                const paid = num($("oPaid").value);

                if (!c || !cl || qty < 1 || price < 0 || paid < 0) return;

                if (qty > num(c.stock) &&
                    !confirm(`Only ${c.stock} cartons are in stock. Save this order anyway?`)) {
                    return;
                }

                state.sales.push({
                    id: uid(),
                    clientId: String(cl.id),
                    cartonId: String(c.id),
                    clientName: cl.name,
                    cartonName: c.name,
                    date: $("oDate").value,
                    qty,
                    price,
                    paid,
                    note: $("oNote").value.trim()
                });

                c.stock = Math.max(0, num(c.stock) - qty);

                save();
                orderModal.hide();
                render();
                notify("Order saved and stock updated");
            }

            function openStock(id) {
                if (!state.cartons.length) {
                    notify("Add a carton type first.");
                    return;
                }

                const old = carton(id);
                $("editTitle").textContent = "Adjust stock";

                $("editFields").innerHTML = `
      <div class="mb-3">
        <label class="form-label">Carton type *</label>
        <select class="form-select" id="fCarton" required></select>
      </div>
      <div class="mb-3">
        <label class="form-label">Action</label>
        <select class="form-select" id="fAction">
          <option value="add">Add to current stock</option>
          <option value="set">Set exact stock amount</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantity *</label>
        <input class="form-control" type="number" min="0" step="1" id="fQty" value="0" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Date *</label>
        <input class="form-control" type="date" id="fDate" value="${today()}" required>
      </div>
      <div>
        <label class="form-label">Note</label>
        <input class="form-control" id="fNote" placeholder="New delivery, correction, etc.">
      </div>`;

                fillSelect($("fCarton"), state.cartons, "Choose carton type");
                if (old) $("fCarton").value = old.id;

                $("editForm").onsubmit = e => {
                    e.preventDefault();

                    const c = carton($("fCarton").value);
                    const qty = num($("fQty").value);
                    const action = $("fAction").value;

                    if (!c || qty < 0) return;

                    c.stock = action === "add" ? num(c.stock) + qty : qty;

                    state.stock.push({
                        id: uid(), cartonId: c.id, date: $("fDate").value,
                        action, qty, note: $("fNote").value.trim()
                    });

                    save();
                    editModal.hide();
                    render();
                    notify("Stock updated");
                };

                editModal.show();
            }

            function showHistory(type, id) {
                const records = state.sales.filter(s =>
                    String(s[type === "client" ? "clientId" : "cartonId"]) === String(id)
                );

                const label = type === "client" ? client(id)?.name : carton(id)?.name;

                state.page = "orders";
                render();

                const app = $("app");
                app.insertAdjacentHTML("afterbegin", `
      <div class="alert alert-primary d-flex justify-content-between align-items-center">
        <span>History for <b>${esc(label || "record")}</b> — ${records.length} orders</span>
        <button class="btn btn-sm btn-outline-primary" id="showAll">Show all</button>
      </div>`);

                $("showAll").onclick = render;

                const body = app.querySelector("tbody");
                if (body) {
                    body.innerHTML = records.length ? records.map(s => `
        <tr>
          <td>${dateText(s.date)}</td>
          <td>${esc(clientName(s))}</td>
          <td>${esc(cartonName(s))}</td>
          <td>${num(s.qty)}</td>
          <td>${cash(s.price)}</td>
          <td>${cash(total(s))}</td>
          <td>${cash(s.paid)}</td>
          <td>${cash(balance(s))}</td>
        </tr>`).join("") : emptyRow("No order history for this record.", 8);
                }
            }

            function exportBackup() {
                const data = {
                    app: "Carton 2",
                    version: 3,
                    exportedAt: new Date().toISOString(),
                    clients: state.clients,
                    cartons: state.cartons,
                    sales: state.sales,
                    stock: state.stock
                };

                const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");

                a.href = url;
                a.download = "carton-2-backup-" + today() + ".json";
                a.click();

                URL.revokeObjectURL(url);
                notify("Backup downloaded");
            }

            function importBackup(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();

                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);

                        if (!Array.isArray(data.clients) ||
                            !Array.isArray(data.cartons) ||
                            !Array.isArray(data.sales)) {
                            throw new Error("Invalid backup");
                        }

                        if (!confirm("This will replace current records. Continue?")) return;

                        state.clients = data.clients;
                        state.cartons = data.cartons;
                        state.sales = data.sales;
                        state.stock = Array.isArray(data.stock) ? data.stock : [];

                        save();
                        render();
                        notify("Backup restored");
                    } catch {
                        notify("Invalid backup file");
                    } finally {
                        e.target.value = "";
                    }
                };

                reader.readAsText(file);
            }

            $("menuBtn").onclick = () => $("sidebar").classList.toggle("open");

            $("today").textContent = new Date().toLocaleDateString(undefined, {
                weekday: "short", day: "numeric", month: "short", year: "numeric"
            });

            render();
        })();
    </script>
</body>

</html>
